<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星航 · STAR VOYAGE｜Ham · 欧漫清线 WebGL2 实时 MV</title>
  <link rel="stylesheet" href="./styles/tokens.css?v=2" />
  <link rel="stylesheet" href="./styles/layout.css?v=2" />
  <link rel="stylesheet" href="./styles/components/subtitles.css?v=2" />
  <link rel="stylesheet" href="./styles/components/controls.css?v=2" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="cinema-root">
    <div id="frame-16x9">
      <div class="letterbox-bar letterbox-top"></div>

      <div id="gl-viewport"></div>

      <div id="scene-overlay">
        <div id="hero-title" class="hero-title-card">
          <div class="hero-title-zh">星 航</div>
          <div class="hero-title-en">STAR VOYAGE · HAM</div>
        </div>
        <div id="operator-badge"></div>
      </div>

      <div id="black-card-layer">
        <div class="end-title-ring"></div>
        <div class="end-title-flare"></div>
        <div class="end-title-wrap">
          <div class="end-title-zh"><span>星</span><span>航</span></div>
          <div class="end-title-line"></div>
          <div class="end-title-en">STAR VOYAGE</div>
        </div>
      </div>

      <div class="letterbox-bar letterbox-bottom">
        <div id="subtitle-box">
          <div id="sub-zh" class="sub-zh-main"></div>
          <div id="sub-en" class="sub-tag-en"></div>
        </div>
      </div>

      <div id="start-curtain">
        <div class="curtain-kicker">HAM · 《太阳之女》 #08 · LIGNE-CLAIRE WEBGL2 MV</div>
        <div class="curtain-title">星 航</div>
        <div class="curtain-sub">STAR VOYAGE</div>
        <div class="curtain-desc">一比特的微光 · 残差 · 注意力网 · 奇异值分解星空 · 八十亿次脉动</div>
        <button id="btn-start" class="curtain-btn">▶ PLAY MV · 放映全片 (04:49)</button>
      </div>

      <div id="hud-controls" class="is-pinned">
        <button id="btn-play" class="hud-btn">PLAY</button>
        <div id="hud-act">ACT 01 · STARRAIL</div>
        <div id="timeline-track">
          <div class="timeline-rail">
            <div id="timeline-fill"></div>
          </div>
        </div>
        <div id="hud-time">00:00 / 04:49</div>
        <button id="btn-speed" class="hud-btn" title="切换播放倍速 (1.0x / 1.25x / 1.5x)">1.0x</button>
        <button id="btn-fs" class="hud-btn">FULL</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
