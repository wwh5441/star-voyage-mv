<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星航 · STAR VOYAGE</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components/subtitles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="cinema-root">
    <div id="frame-16x9">
      <div class="letterbox-bar letterbox-top"></div>

      <div id="gl-viewport"></div>

      <div id="scene-overlay">
        <div id="hero-title" class="hero-title-card">
          <div class="hero-title-zh">星 航</div>
          <div class="hero-title-en">STAR VOYAGE · HAM</div>
        </div>
      </div>

      <div id="black-card-layer">
        <div class="end-title-ring"></div>
        <div class="end-title-flare"></div>
        <div class="end-title-wrap">
          <div class="end-title-zh"><span>星</span><span>航</span></div>
          <div class="end-title-line"></div>
          <div class="end-title-en">STAR VOYAGE</div>
        </div>
      </div>

      <div class="letterbox-bar letterbox-bottom">
        <div id="subtitle-box">
          <div id="sub-zh" class="sub-zh-main"></div>
          <div id="sub-en" class="sub-tag-en"></div>
        </div>
      </div>

      <div id="start-curtain">
        <div class="curtain-title">星 航</div>
        <div class="curtain-sub">STAR VOYAGE</div>
        <button id="btn-start" class="curtain-btn">▶ PLAY</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
